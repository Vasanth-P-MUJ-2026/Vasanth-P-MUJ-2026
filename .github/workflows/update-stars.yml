name: Update Starred Repos

on:
  schedule:
    # Runs every day at 00:00 UTC — adjust cron as needed
    - cron: '0 0 * * *'
  workflow_dispatch: {}   # allows manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  update-starred-list:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch starred repositories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: VasanthPrakasam
        run: |
          echo "# ⭐ Starred Repositories" > starred_list.md
          echo "" >> starred_list.md
          echo "Auto-updated on $(date -u +'%Y-%m-%d %H:%M UTC')" >> starred_list.md
          echo "" >> starred_list.md

          page=1
          while :; do
            response=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/users/$GH_USERNAME/starred?per_page=100&page=$page")

            count=$(echo "$response" | jq 'length')
            if [ "$count" -eq 0 ]; then
              break
            fi

            echo "$response" | jq -r '.[] | "- [\(.full_name)](\(.html_url)) — \(.description // "No description")"' >> starred_list.md

            page=$((page + 1))
          done

      - name: Commit and push if changed
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "github-actions[bot]"
          git add starred_list.md
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "Auto-update starred repos"
            git push
          )
